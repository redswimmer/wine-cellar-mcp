name: Deploy

# Dev deploys on every merge to main so code and infrastructure are proven together early.
# Run it by hand to push any branch to dev, or to deploy main to prod.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: deploy-${{ inputs.stage || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage || 'dev' }}
    env:
      STAGE: ${{ inputs.stage || 'dev' }}
    outputs:
      mcp_url: ${{ steps.cdk.outputs.mcp_url }}
    steps:
      - name: Check AWS setup
        id: setup
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "::warning::AWS_DEPLOY_ROLE_ARN is not set; skipping deploy. See docs/DEPLOY.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refuse prod from a branch other than main
        if: env.STAGE == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Prod deploys only from main."
          exit 1
      - uses: actions/checkout@v7
        if: steps.setup.outputs.ready == 'true'
      - uses: astral-sh/setup-uv@v7
        if: steps.setup.outputs.ready == 'true'
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.setup.outputs.ready == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          # Only used to get credentials; the stacks' region comes from cdk.json.
          aws-region: us-east-1
      - name: Build Lambda package
        if: steps.setup.outputs.ready == 'true'
        run: ./scripts/build_lambda.sh
      - name: CDK deploy
        id: cdk
        if: steps.setup.outputs.ready == 'true'
        run: |
          # WineCellar-Observability is account-wide; deploying it with each stage keeps it from drifting.
          npx -y aws-cdk@2.1144.0 deploy "WineCellar-${STAGE}" WineCellar-Observability \
            --require-approval never --outputs-file cdk-outputs.json
          echo "mcp_url=$(jq -r --arg s "WineCellar-${STAGE}" '.[$s].McpUrl' cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "### Deployed WineCellar-${STAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat cdk-outputs.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage || 'dev' }}
    env:
      STAGE: ${{ inputs.stage || 'dev' }}
      WINE_MCP_TOKEN: ${{ secrets.WINE_MCP_TOKEN }}
      WINE_MCP_URL: ${{ needs.deploy.outputs.mcp_url }}
    steps:
      - name: Check token and URL
        run: |
          if [ -z "$WINE_MCP_TOKEN" ]; then
            echo "::error::WINE_MCP_TOKEN is not set on the ${STAGE} environment, so e2e tests can't run. See docs/DEPLOY.md."
            exit 1
          fi
          if [ -z "$WINE_MCP_URL" ]; then
            echo "::error::The deploy job didn't report an MCP URL, so e2e tests can't run."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: E2E tests against ${{ env.STAGE }}
        run: |
          uv sync --frozen
          uv run pytest tests/e2e
