<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6f73"/></marker>
  </defs>
  <rect width="960" height="500" rx="18" fill="#fbf7f2"/>
  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#3b1f2b">Your agent remembers the wines you like</text>

  <!-- You -->
  <g transform="translate(40,80)">
    <rect width="240" height="340" rx="14" fill="#fff" stroke="#e6d9cf"/>
    <text x="120" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#3b1f2b">You</text>
    <text x="120" y="58" text-anchor="middle" font-size="13" fill="#7a6a6e">talk or snap a photo</text>
    <rect x="16" y="80" width="208" height="62" rx="12" fill="#f3e6e8"/>
    <text x="28" y="105" font-size="14" fill="#3b1f2b">"Loved this Rioja.</text>
    <text x="28" y="126" font-size="14" fill="#3b1f2b">Smoky, great with lamb."</text>
    <rect x="16" y="156" width="208" height="62" rx="12" fill="#f3e6e8"/>
    <text x="28" y="181" font-size="14" fill="#3b1f2b">"What was that smoky</text>
    <text x="28" y="202" font-size="14" fill="#3b1f2b">red I liked?"</text>
    <rect x="16" y="232" width="208" height="88" rx="12" fill="#f3e6e8"/>
    <rect x="46" y="238" width="12" height="7" rx="1.5" fill="#3b1f2b"/>
    <path d="M47,245 L57,245 L57,262 C57,268 68,272 68,282 L68,310 Q68,314 64,314 L40,314 Q36,314 36,310 L36,282 C36,272 47,268 47,262 Z" fill="#5a1f33"/>
    <rect x="39" y="285" width="26" height="18" rx="2" fill="#f7efe6"/>
    <line x1="43" y1="291" x2="61" y2="291" stroke="#7b2d43" stroke-width="1.5"/>
    <line x1="45" y1="297" x2="59" y2="297" stroke="#b9a3a8" stroke-width="1.2"/>
    <text x="86" y="270" font-size="14" fill="#3b1f2b">"Have I had</text>
    <text x="86" y="291" font-size="14" fill="#3b1f2b">this one?"</text>
  </g>

  <line x1="290" y1="250" x2="352" y2="250" stroke="#8a6f73" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="352" y1="280" x2="290" y2="280" stroke="#8a6f73" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Agent -->
  <g transform="translate(360,150)">
    <rect width="200" height="200" rx="14" fill="#3b1f2b"/>
    <circle cx="100" cy="62" r="26" fill="none" stroke="#e9d6da" stroke-width="3"/><circle cx="91" cy="58" r="3.5" fill="#e9d6da"/><circle cx="109" cy="58" r="3.5" fill="#e9d6da"/><path d="M90,70 Q100,77 110,70" stroke="#e9d6da" stroke-width="3" fill="none"/>
    <text x="100" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Your AI agent</text>
    <text x="100" y="144" text-anchor="middle" font-size="13" fill="#e9d6da">Claude, OpenClaw,</text>
    <text x="100" y="163" text-anchor="middle" font-size="13" fill="#e9d6da">or any MCP client</text>
  </g>

  <line x1="570" y1="250" x2="632" y2="250" stroke="#8a6f73" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="632" y1="280" x2="570" y2="280" stroke="#8a6f73" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Cellar -->
  <g transform="translate(640,80)">
    <rect width="280" height="340" rx="14" fill="#fff" stroke="#e6d9cf"/>
    <text x="140" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#3b1f2b">Your wine cellar</text>
    <text x="140" y="58" text-anchor="middle" font-size="13" fill="#7a6a6e">wine-cellar-mcp</text>
    <g transform="translate(16,78)">
      <rect width="248" height="76" rx="10" fill="#f7efe6"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#7b2d43">Remember wines</text>
      <text x="14" y="47" font-size="13" fill="#3b1f2b">Your verdict: love, like, meh,</text>
      <text x="14" y="65" font-size="13" fill="#3b1f2b">dislike. Plus notes and photos.</text>
    </g>
    <g transform="translate(16,164)">
      <rect width="248" height="76" rx="10" fill="#f7efe6"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#7b2d43">Search by words</text>
      <text x="14" y="47" font-size="13" fill="#3b1f2b">Finds wines by meaning,</text>
      <text x="14" y="65" font-size="13" fill="#3b1f2b">not just exact names.</text>
    </g>
    <g transform="translate(16,250)">
      <rect width="248" height="76" rx="10" fill="#f7efe6"/>
      <text x="14" y="26" font-size="15" font-weight="700" fill="#7b2d43">Search by label photo</text>
      <text x="14" y="47" font-size="13" fill="#3b1f2b">Snap a bottle at the store and</text>
      <text x="14" y="65" font-size="13" fill="#3b1f2b">see if you've had it.</text>
    </g>
  </g>

  <text x="480" y="468" text-anchor="middle" font-size="15" fill="#5a4a4e">Agent: "Yes, the 2019 Rioja. You loved it: smoky, great with lamb."</text>
</svg>
