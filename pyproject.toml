[project]
name = "wine-cellar-mcp"
version = "0.1.0"
description = "Wine preference MCP server for agents, on AWS serverless"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.109",
    "mangum>=0.22.0",
    "mcp>=2.3.0",
    "python-ulid>=4.0.1",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
wine-tokens = "wine_cellar.admin:main"

[dependency-groups]
dev = [
    "aws-cdk-lib==2.272.0",
    "constructs>=10.8.1",
    "import-linter>=2.15",
    "moto>=5.2.3",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wine_cellar"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
extend-exclude = ["cdk.out", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["src", "infra", "tests"]

# The jsii-generated CDK bindings name protocol parameters differently from their implementations
# (e.g. IFunction.grant_invoke(identity) vs Function.grant_invoke(grantee)), which ty reports as
# protocol mismatches. Those are false positives in the bindings, not in our code.
[[tool.ty.overrides]]
include = ["infra/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

# Architecture rules, checked in CI by `uv run lint-imports`.
[tool.importlinter]
root_package = "wine_cellar"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: entry points > wiring > transport > service > stores > domain"
type = "layers"
containers = ["wine_cellar"]
layers = [
    "handler | photo_handler | admin",
    "bootstrap",
    "server | lambda_adapter",
    "service",
    "tokens",
    "users",
    "repository | photos | vectors | search",
    "auth | config",
    "models",
]

[[tool.importlinter.contracts]]
name = "Only entry points and bootstrap create AWS clients"
type = "forbidden"
source_modules = [
    "wine_cellar.server",
    "wine_cellar.service",
    "wine_cellar.models",
    "wine_cellar.search",
    "wine_cellar.repository",
    "wine_cellar.vectors",
    "wine_cellar.users",
    "wine_cellar.tokens",
]
forbidden_modules = ["boto3"]

[[tool.importlinter.contracts]]
name = "The MCP server talks to the service, not to stores"
type = "forbidden"
source_modules = ["wine_cellar.server"]
forbidden_modules = ["wine_cellar.photos", "wine_cellar.repository", "wine_cellar.vectors"]
allow_indirect_imports = true
